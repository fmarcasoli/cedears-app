name: Actualizar fundamentals

on:
  schedule:
    - cron: "0 10 * * 1-5"   # 07:00 en Argentina, días hábiles
  workflow_dispatch:
    inputs:
      universe:
        description: "Regenerar también la lista de CEDEARs"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Regenerar lista de CEDEARs
        if: ${{ github.event.inputs.universe == 'true' }}
        run: python scripts/build_universe.py
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: Bajar fundamentals de la SEC
        run: python scripts/build_data.py
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: Commit si hubo cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data public/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "datos: actualización $(date -u +%Y-%m-%d)"
            git push
          fi
