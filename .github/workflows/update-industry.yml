name: Actualizar industria (Investing)

# La columna "Industria" de Investing cambia poco: una vez por semana alcanza, y así se
# hacen pocas visitas (Investing limita a ~1 página cada 2-3 segundos).
on:
  schedule:
    - cron: "0 12 * * 0"   # domingos 09:00 en Argentina
  workflow_dispatch:

permissions:
  contents: write

jobs:
  industry:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Bajar valores de industria de Investing
        # Si Investing bloquea el acceso desde GitHub, el script termina con error y se
        # conserva el archivo anterior (data/investing_industry.json).
        run: python scripts/investing.py
      - name: Commit si hubo cambios
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/investing_map.json data/investing_industry.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "industria: Investing $(date -u +%Y-%m-%d)"
            git push
          fi
